name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Firebase config is set
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          DEMO: ${{ vars.DEMO }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ] && [ "$DEMO" != "true" ]; then
            echo "::error title=Missing FIREBASE_CONFIG::Add the FIREBASE_CONFIG repository variable (Settings → Secrets and variables → Actions → Variables). See README."
            exit 1
          fi
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.FIREBASE_FUNCTIONS_REGION }}
          VITE_DEMO: ${{ vars.DEMO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
